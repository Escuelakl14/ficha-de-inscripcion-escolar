<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reporte Pre-escolar</title>
  <style>
    /* Estilos para la pantalla */
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f6f8;
      color: #333333;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid #e1e8ed;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #2b6cb0;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }

    .badge-nivel {
      background-color: #ebf8ff;
      color: #2b6cb0;
      font-weight: 700;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.95rem;
      border: 1px solid #bee3f8;
    }

    .btn-imprimir {
      background-color: #2b6cb0;
      color: #ffffff;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .btn-imprimir:hover {
      background-color: #2c5282;
    }

    /* Reglas específicas para la impresión */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
        margin: 0;
      }

      .no-print {
        display: none !important; /* Oculta botones al imprimir */
      }

      .container {
        box-shadow: none;
        border: none;
        width: 100%;
        max-width: 100%;
        padding: 0;
      }

      .header {
        border-bottom: 2px solid #000000;
      }

      .badge-nivel {
        background: transparent;
        color: #000000;
        border: none;
        padding: 0;
        font-size: 1.1rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Botón visible solo en pantalla -->
    <button class="btn-imprimir no-print" onclick="window.print()">Imprimir Reporte</button>

    <div class="header">
      <h2>Planilla de Inscripción / Reporte</h2>
      <!-- Nivel escrito como Pre-escolar -->
      <span class="badge-nivel">Pre-escolar</span>
    </div>

    <div class="content">
      <p><strong>Nivel Educativo:</strong> Pre-escolar</p>
      <p>Aquí va el contenido de la planilla o datos del estudiante...</p>
    </div>
  </div>

</body>
</html>
